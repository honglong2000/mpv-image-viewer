profile=gpu-hq
scale=ewa_lanczos4sharpest
hdr-compute-peak=yes
vo=gpu-next
gpu-api=d3d11
loop-file=inf
fullscreen=yes
target-colorspace-hint=yes
target-contrast=inf
hwdec=auto
target-peak=auto
fullscreen=yes
keep-open=yes
osd-on-seek=no
appname=mpv image viewer
autoload-files=yes
file-sort=natural
file-sort-directories=natural
cursor-autohide=always
cursor-autohide-fs-only=no
mouse_move ignore

## MISC
mute=yes
# the osc is mostly useful for videos
osc=no
# don't try to autoload subtitles or audio files
sub-auto=no
audio-file-auto=no
# get rid of the useless V: 00:00:00 / 00:00:00 line
term-status-msg=

# replace mpv with mvi in the window title
title="${?media-title:${media-title}}${!media-title:No file} - mpv image viewer"

# don't slideshow by default
image-display-duration=inf
# loop files in case of webms or gifs
loop-file=inf
# and loop the whole playlist
loop-playlist=inf

# you need this if you plan to use drag-to-pan or pan-follows-cursor with MOUSE_LEFT 
window-dragging=no

#according to haasn, aspect ratio info for PNG and JPG is "universally bust"
[extension.png]
video-aspect-override=no

[extension.jpg]
video-aspect-override=no

[extension.jpeg]
profile=extension.jpg

[silent]
msg-level=all=no
osd-msg1=
osd-msg2=
osd-msg3=
osd-bar=no
osd-level=0
osd-bar=no
osd-on-seek=no
osd-on-pause=no
osd-status-msg=